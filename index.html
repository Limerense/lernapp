<style>
/* Warmes Petrol/Grün – Biologie-Look. Hell + Dunkel */
:root{
  --bg:#eef3ee;--bg2:#e3ece6;--card:#fbfcf8;--ink:#17302f;--mute:#5e7470;--line:#d3e0d8;
  --acc:#1e7c74;--acc2:#2f9a6a;--acc-soft:#dcefe9;--on-acc:#fff;
  --ok:#2f8f4e;--ok-soft:#e1f2e5;--bad:#c2553d;--bad-soft:#f8e5df;--warm:#d98e3a;--warm-soft:#f8ead7;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f2a2d;--bg2:#12343a;--card:#173d42;--ink:#e8f3ee;--mute:#9fbcb5;--line:#28545a;
  --acc:#5cc8b4;--acc2:#7ed39a;--acc-soft:#1d4f52;--on-acc:#0d2628;
  --ok:#7fd69a;--ok-soft:#1d4a37;--bad:#ff9a80;--bad-soft:#4a2b28;--warm:#f0b062;--warm-soft:#4a3a24;}}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;
  background:radial-gradient(1200px 500px at 10% -10%,var(--bg2),transparent 70%),var(--bg);background-attachment:fixed}
.wrap{max-width:820px;margin:0 auto;padding:max(24px,env(safe-area-inset-top)) 16px 80px}
h1{font-size:26px;margin:0 0 4px;letter-spacing:-.01em}
h2{font-size:18px;margin:30px 0 12px}
.sub{color:var(--mute);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 1px 2px rgba(20,60,55,.05)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.mode{cursor:pointer;text-align:left;font:inherit;color:inherit;transition:border-color .15s,transform .1s}
@media (hover:hover){.mode:hover{border-color:var(--acc)}}
.mode:active{transform:scale(.99)}
.mode b{display:block;font-size:17px;margin-bottom:4px}
.mode span{color:var(--mute);font-size:14px}
.mode.hero{background:linear-gradient(135deg,var(--acc),var(--acc2));border:0;color:var(--on-acc)}
.mode.hero span{color:var(--on-acc);opacity:.85}
.mode[disabled]{opacity:.5;cursor:default}
.chap{margin-bottom:10px;padding:16px}
.chap .head{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.chap .t{font-weight:650;font-size:15px}
.chap .n{color:var(--mute);font-size:13px;white-space:nowrap}
.bar{height:7px;background:var(--line);border-radius:4px;overflow:hidden;margin:10px 0 6px;display:flex}
.bar i{display:block;height:100%}
.bar .g{background:var(--ok)}.bar .r{background:var(--bad);opacity:.75}
.legend{font-size:12px;color:var(--mute);display:flex;gap:12px;flex-wrap:wrap}
.legend .due{color:var(--warm);font-weight:600}
.cbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.cbtns button{flex:1 1 auto}
button.btn{font:inherit;font-weight:650;border:0;border-radius:11px;padding:10px 18px;cursor:pointer;background:var(--acc);color:var(--on-acc)}
button.btn:disabled{opacity:.4;cursor:default}
button.ghost{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:11px;padding:9px 14px;cursor:pointer}
@media (hover:hover){button.ghost:hover:not(:disabled){border-color:var(--acc)}}
button.ghost:disabled{opacity:.45;cursor:default}
button.ghost.red{color:var(--bad)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.pill{font-size:13px;color:var(--mute)}
.learnstat{margin:-6px 0 14px}
.passline{font-size:13px;margin:8px 0 2px;color:var(--mute)}
.passtag{display:inline-block;font-size:12px;font-weight:700;color:var(--acc);background:var(--acc-soft);border-radius:6px;padding:2px 8px;margin-right:4px}
.infobox.passdone{border:1px solid var(--ok);font-size:15px;line-height:1.5}.learnstat .bar{margin:0 0 6px}
.q{font-size:19px;font-weight:650;margin:0 0 6px}
.meta{font-size:13px;color:var(--mute);margin-bottom:16px}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;margin-right:6px;vertical-align:1px}
.badge.new{background:var(--acc-soft);color:var(--acc)}
.badge.rep{background:var(--warm-soft);color:var(--warm)}
.badge.again{background:var(--bad-soft);color:var(--bad)}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;font:inherit;color:inherit;background:var(--card);
  border:2px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;cursor:pointer}
@media (hover:hover){.opt:not(.sel):not(.locked):hover{border-color:var(--acc)}}
button,a{-webkit-tap-highlight-color:transparent}
button:focus{outline:none}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.opt .k{flex:none;width:26px;height:26px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--mute)}
.opt.sel{border-color:var(--acc);background:var(--acc-soft)}
.opt.sel .k{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .k{background:var(--ok);border-color:var(--ok);color:var(--on-acc)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad .k{background:var(--bad);border-color:var(--bad);color:var(--on-acc)}
.opt.miss{border-color:var(--ok);border-style:dashed}
.opt .tag{margin-left:auto;font-size:12px;font-weight:700;white-space:nowrap;padding-left:8px}
.opt.locked{cursor:default}
.verdict{font-weight:700;margin:6px 0 4px}
.verdict.ok{color:var(--ok)}.verdict.bad{color:var(--bad)}
.next-info{font-size:13px;color:var(--mute);margin-bottom:6px}
.actions{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:16px}
.hint{font-size:12px;color:var(--mute)}
.big{font-size:44px;font-weight:800;margin:4px 0}
.row{padding:12px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row summary{cursor:pointer;list-style:none;display:flex;gap:12px;align-items:baseline}
.row summary::-webkit-details-marker{display:none}
.row .cnt{flex:none;min-width:62px;font-weight:700;color:var(--bad)}
.row ul{margin:8px 0 0 74px;padding:0}
.row li{margin:3px 0;list-style:none}
.row li.c{color:var(--ok);font-weight:600}
.row li.c::before{content:"✓ "}.row li:not(.c)::before{content:"✗ ";color:var(--mute)}
select{font:inherit;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);max-width:100%}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:12px}
.stats3 .card{padding:14px}
.stats3 b{display:block;font-size:24px}
.stats3 span{font-size:13px;color:var(--mute)}
.syncbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 14px}
.warnbox{background:var(--bad-soft);color:var(--bad);padding:10px 14px;border-radius:10px;margin-bottom:14px;font-size:14px}
.infobox{background:var(--acc-soft);padding:12px 14px;border-radius:12px;font-size:14px;margin:12px 0}
.progline{height:4px;background:var(--line);border-radius:2px;margin:-4px 0 14px;overflow:hidden}
.progline i{display:block;height:100%;background:var(--acc)}
.deckbar{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 18px;padding:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;width:fit-content;max-width:100%}
.deckbar .deck{font:inherit;font-size:14px;font-weight:600;border:0;border-radius:9px;padding:8px 14px;cursor:pointer;background:transparent;color:var(--mute)}
.deckbar .deck.on{background:var(--acc);color:var(--on-acc)}
.badge.ai{background:var(--acc-soft);color:var(--acc);border:1px dashed var(--acc)}
.badge.card{background:var(--warm-soft);color:var(--warm)}
.cardans{background:var(--acc-soft);border-left:4px solid var(--acc);border-radius:10px;padding:14px 16px;font-size:17px;font-weight:600;margin:6px 0 10px;white-space:pre-wrap}
.cardans.long{font-size:15px;font-weight:450;line-height:1.55}
.qimg{display:block;max-width:100%;max-height:42vh;border-radius:12px;margin:4px 0 12px;cursor:zoom-in;border:1px solid var(--line)}
.qimg.big{max-height:none;cursor:zoom-out}
.solution{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:12px 0 4px;font-size:15px}
.solution p{margin:6px 0}
.sol-h{font-weight:700;margin-bottom:4px}
.sol-right{color:var(--ok);font-weight:600}
.sol-note{color:var(--warm);font-size:14px}
.solbtn{margin-top:10px}
.solwrap{margin:8px 0 0 74px}
.solwrap summary{cursor:pointer;color:var(--acc);font-size:14px;font-weight:600}
@media (max-width:520px){.solwrap{margin-left:0}}
@media (max-width:520px){.stats3{grid-template-columns:1fr}.row ul{margin-left:0}.cbtns button{flex:1 1 100%}}

<div class="wrap" id="app">Lade…</div>
<script>
window.LERNAPP_WEB = 1;
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
window.LERNAPP_READY = (async () => {
  const app = document.getElementById('app');
  const u8 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const b64 = b => btoa(String.fromCharCode(...new Uint8Array(b)));
  let enc;
  try { enc = await (await fetch('data.enc.json', { cache: 'no-cache' })).json(); }
  catch (e) { app.innerHTML = '<div class="card">Keine Verbindung – bitte einmal mit Internet öffnen.</div>'; throw e; }
  const open = async raw => {
    const k = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u8(enc.iv) }, k, u8(enc.ct));
    const d = JSON.parse(new TextDecoder().decode(pt));
    window.LERNAPP_DATA = d.files; window.LERNAPP_SYNC = d.sync;
  };
  const saved = localStorage.getItem('lernapp_key');
  if (saved) { try { await open(u8(saved)); return; } catch (_) { localStorage.removeItem('lernapp_key'); } }
  await new Promise(done => {
    app.innerHTML = '<div class="card" style="max-width:420px;margin:12vh auto 0"><h1 style="margin-top:0">🔒 Lernapp</h1>' +
      '<p class="sub">Bitte einmalig das Passwort eingeben.</p><form id="pwf"><input id="pw" type="password" autocomplete="current-password" ' +
      'style="width:100%;box-sizing:border-box;font:inherit;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)">' +
      '<p id="pwe" class="hint" style="color:var(--bad);min-height:1em"></p><button class="btn" style="width:100%">Öffnen</button></form></div>';
    document.getElementById('pw').focus();
    document.getElementById('pwf').onsubmit = async e => {
      e.preventDefault();
      const err = document.getElementById('pwe'); err.textContent = 'Prüfe …';
      try {
        const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(document.getElementById('pw').value), 'PBKDF2', false, ['deriveBits']);
        const raw = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: u8(enc.salt), iterations: enc.iter }, base, 256);
        await open(raw);
        localStorage.setItem('lernapp_key', b64(raw));
        app.innerHTML = 'Lade…'; done();
      } catch (_) { err.textContent = 'Falsches Passwort.'; }
    };
  });
})();
</script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const LETTERS = 'ABCDEF';
const EXAM_MAX = 80;
const examN = () => Math.min(EXAM_MAX, DB.questions.length);

/* ---------- Lernsystem (Spaced Repetition) ----------
   Stufe 0 = neu/falsch, danach Abstände in Tagen. Muss mit server.py übereinstimmen. */
const INTERVALS = [0, 1, 3, 7, 14, 30, 60, 120];
const DAY = 86400000, SLACK = 4 * 3600000;
const ROUND = 10;        // Fragen pro Runde
const MAX_DUE = 7;       // höchstens so viele Wiederholungen pro Runde -> mind. 3 neue, solange es neue gibt

let DECKS = [], DECK = null, DB, CH = {}, BYID = {}, P = { stats: {}, history: [] }, serverOK = true, PHONE_URLS = [];
let S = null; // aktuelle Session
// WEB = veröffentlichte Version (GitHub Pages): Fragen kommen entschlüsselt aus data.enc.json, Fortschritt liegt im Browser
const WEB = !!window.LERNAPP_WEB;
let SYNC = null, SYNC_ON = false;
const imgURL = p => WEB ? (window.LERNAPP_DATA[p] || '') : p;
async function getJSON(p) {
  if (WEB) return JSON.parse(JSON.stringify(window.LERNAPP_DATA[p]));
  return (await fetch(p, { cache: 'no-store' })).json();
}

function levelOf(s) { return s.level ?? (s.streak > 0 ? Math.min(s.streak + 1, 7) : 0); }
function dueOf(s) { return s.due ?? (s.last || 0) + INTERVALS[levelOf(s)] * DAY - (levelOf(s) ? SLACK : 0); }
function applyAnswer(s, right, t, pass) {
  // Durchgang: nur die ERSTE Antwort pro Durchgang zählt (s.pr), Ergebnis des vorigen Durchgangs bleibt in s.pp
  if (!s.pr && s.seen) s.pr = { p: 1, r: !s.wrong };
  if (pass && (!s.pr || pass > s.pr.p)) { if (s.pr) s.pp = s.pr; s.pr = { p: pass, r: !!right }; }
  const first = !s.seen; let lvl = levelOf(s);
  s.seen = (s.seen || 0) + 1; s.last = Math.max(s.last || 0, t);
  if (right) { s.streak = (s.streak || 0) + 1; lvl = first ? 2 : Math.min(lvl + 1, 7); s.due = t + INTERVALS[lvl] * DAY - SLACK; }
  else { s.wrong = (s.wrong || 0) + 1; s.streak = 0; s.lastWrong = t; lvl = 0; s.due = t; }
  s.level = lvl;
}
/* Durchgänge (pro Kapitel): Ein Durchgang ist fertig, wenn jede Frage des Kapitels einmal beantwortet wurde.
   Gezählt wird nur die erste Antwort im Durchgang – wer eine Frage falsch hatte und sie später richtig wiederholt,
   hat sie in diesem Durchgang trotzdem falsch. Erst im nächsten Durchgang zählt sie wieder neu. */
const prOf = s => s ? (s.pr || (s.seen ? { p: 1, r: !s.wrong } : null)) : null;
function passRes(s, p) { const a = prOf(s); if (a && a.p === p) return a.r; if (s && s.pp && s.pp.p === p) return s.pp.r; return null; }
function chapPass(c) {   // aktueller Durchgang eines Kapitels
  const ids = chapIds(c); let M = 0;
  for (const id of ids) M = Math.max(M, prOf(P.stats[id])?.p || 0);
  if (!M) return 1;
  return ids.every(id => prOf(P.stats[id])?.p === M) ? M + 1 : M;
}
const passOf = id => chapPass(BYID[id].chapter);

const LDB = 'lernapp_db';

  if (path.startsWith('/api/sync')) { await webSync(); return ldb(); }
  const d = ldb();
  if (path.startsWith('/api/progress')) return d;

/* ---------- Synchronisieren (Handy <-> Mac über ein privates GitHub-Repo) ----------
   Zusammenführen: pro Frage gewinnt der Stand, der zuletzt beantwortet wurde ("last").
   Gelöschte Fächer werden über Zeitstempel (deleted/resetHist) gemerkt, damit alte Stände nicht zurückkommen.
   Gleiche Logik steht in server.py (merge_progress). */
function mergeP(a, b) {
  const o = { stats: {}, history: [], deleted: {}, resetHist: {} };
  for (const x of [a, b]) {
    for (const [k, t] of Object.entries(x.deleted || {})) o.deleted[k] = Math.max(o.deleted[k] || 0, t);
    for (const [k, t] of Object.entries(x.resetHist || {})) o.resetHist[k] = Math.max(o.resetHist[k] || 0, t);
  }
  for (const x of [a, b]) for (const [id, st] of Object.entries(x.stats || {})) {
    if ((o.deleted[id] || 0) >= (st.last || 0)) continue;
    const cur = o.stats[id];
    if (!cur || (st.last || 0) > (cur.last || 0)) o.stats[id] = st;
  }
  const seen = new Set();
  for (const h of [...(a.history || []), ...(b.history || [])]) {
    const dk = h.deck || 'bio-gen-1';
    if ((o.resetHist[dk] || 0) >= (h.t || 0)) continue;
    const key = `${h.t}|${dk}|${h.title}`;
    if (seen.has(key)) continue;
    seen.add(key); o.history.push(h);
  }
  o.history.sort((x, y) => (x.t || 0) - (y.t || 0));
  o.history = o.history.slice(-300);
  return o;
}
const canon = o => JSON.stringify(o, (k, v) => v && typeof v === 'object' && !Array.isArray(v) ? Object.fromEntries(Object.entries(v).sort()) : v);

function ghFile(method, body) {
  return fetch(`https://api.github.com/repos/${SYNC.owner}/${SYNC.repo}/contents/fortschritt.json` + (method === 'GET' ? `?t=${Date.now()}` : ''), {
    method, cache: 'no-store', body: body && JSON.stringify(body),
    headers: { Authorization: 'Bearer ' + SYNC.token, Accept: 'application/vnd.github+json' } });
}
async function webSync() {
  for (let attempt = 0; attempt < 3; attempt++) {
    const r = await ghFile('GET');
    let remote = { stats: {}, history: [] }, sha;
    if (r.status === 200) { const j = await r.json(); sha = j.sha; remote = JSON.parse(b64d(j.content)); }
    else if (r.status !== 404) throw new Error('GitHub ' + r.status);
    const merged = mergeP(ldb(), remote);
    if (canon(merged) !== canon(mergeP(remote, {}))) {
      const put = await ghFile('PUT', { message: 'Fortschritt synchronisiert', content: b64e(JSON.stringify(merged)), sha });
      if (put.status === 409 || put.status === 422) continue; // jemand anderes war schneller -> nochmal
      if (!put.ok) throw new Error('GitHub ' + put.status);

/* ---------- Sessions ---------- */
function baseSession(mode, title, extra = {}) {
  S = Object.assign({ mode, title, ids: [], i: 0, right: 0, done: 0, answers: [], feedback: true, endless: false, counted: {}, passLog: [], flags: {}, tf: {}, points: 0 }, extra);
}
function startChapter(c) {
  // macht dort weiter, wo du aufgehört hast: nur die im aktuellen Durchgang noch offenen Fragen
  const all = chapIds(c), open = all.filter(isOpen);
  baseSession('chapter', `Kapitel ${c}: ${CH[c]}`, { chapter: c, ids: shuffle(open), offset: all.length - open.length });
  showQ();
}
function startWrong(c) {
  const ids = (c ? chapIds(c) : allIds()).filter(toFix);
  if (!ids.length) return;
  baseSession('wrong', c ? `Falsche · Kapitel ${c}` : 'Alle Fehler', { chapter: c, ids: shuffle(ids) });
  showQ();
}
const EXAM_Q = 25, EXAM_MIN = 25, EXAM_PASS = 70;   // wie der Moodle-Test: 25 Fragen, 25 Minuten, bestanden ab 70 %
function startExam() {
  const pool = DB.questions.filter(q => q.type !== 'card' && q.options && !(DB.chapters.find(c => c.id === q.chapter) || {}).practical).map(q => q.id);
  const n = Math.min(EXAM_Q, pool.length);
  baseSession('exam', `Test · ${n} questions · ${EXAM_MIN} min`, { ids: shuffle(pool).slice(0, n), feedback: false, deadline: Date.now() + EXAM_MIN * 60000, started: Date.now() });
  clearInterval(TIMER); TIMER = setInterval(tick, 1000);
  showQ();
}
function startEndless() {
  const pool = allIds();
  baseSession('endless', 'Endlos zufällig', { ids: shuffle(pool), endless: true, pool });
  showQ();
}

/* ---------- Schlau lernen ----------
   - Runde = ROUND Fragen: fällige Wiederholungen (max MAX_DUE, älteste/schwächste zuerst) + neue Fragen.
   - Falsch beantwortete Fragen werden in die 2. Hälfte der NÄCHSTEN Runde eingestreut (Abstand garantiert).
   - Jede Frage höchstens 2× pro Sitzung (1× + 1 Wiederholung bei Fehler). */
function startLearn(c) {
  baseSession('learn', c ? `Schlau lernen · Kapitel ${c}` : 'Schlau lernen · alle Kapitel',
    { chapter: c, pool: c ? chapIds(c) : allIds(), endless: true, used: {}, retry: [], round: 0, roundLen: 0, roundPos: 0, extra: false });
  nextRound();
  if (!S.ids.length) return learnEmpty();
  showQ();
}
function nextRound() {
  const used = S.used, now = Date.now();
  const avail = S.pool.filter(id => !used[id]);
  const due = avail.filter(isDue).sort((a, b) => levelOf(P.stats[a]) - levelOf(P.stats[b]) || dueOf(P.stats[a]) - dueOf(P.stats[b]));
  const fresh = shuffle(avail.filter(isOpen)).sort((a, b) => passOf(a) - passOf(b));
  let pick = due.slice(0, MAX_DUE);
  pick = pick.concat(fresh.slice(0, ROUND - pick.length));
  if (pick.length < ROUND) pick = pick.concat(due.slice(MAX_DUE, MAX_DUE + ROUND - pick.length));
  if (!pick.length && !S.retry.length) {
    // alles Fällige + Neue erledigt: Extra-Übung mit den als Nächstes fälligen Fragen
    S.extra = true;
    const soon = avail.filter(id => !isNew(id)).sort((a, b) => dueOf(P.stats[a]) - dueOf(P.stats[b]));
    pick = soon.slice(0, ROUND);
  }
  let round = shuffle(pick);
  // Fehler aus der letzten Runde in die zweite Hälfte einstreuen
  const retry = shuffle(S.retry); S.retry = [];
  for (const id of retry) {
    const lo = Math.ceil(round.length / 2), pos = lo + Math.floor(Math.random() * (round.length - lo + 1));
    round.splice(pos, 0, id);
  }
  S.round++; S.roundLen = round.length; S.roundPos = 0;
  S.ids = S.ids.slice(0, S.i).concat(round);
}
function learnEmpty() {
  document.body.classList.remove('mdl-on');
  baseSession('none', '');
  $('#app').innerHTML = `<div class="top"><button class="ghost" onclick="menu()">← Menü</button></div>
    <div class="card"><div class="big">🎉</div><p><b>Alles erledigt!</b> In diesem Bereich gibt es gerade nichts mehr zu lernen.</p>
    <button class="btn" onclick="menu()">Zurück zum Menü</button></div>`;
  S = null;
}

function showQ() {
  if (S.mode === 'learn' && S.i >= S.ids.length) {
    nextRound();
    if (S.i >= S.ids.length) return finish(true);
  }
  if (S.mode === 'endless' && S.i >= S.ids.length) S.ids = S.ids.concat(shuffle(S.pool));
  const q = BYID[S.ids[S.i]];
  // „All of the above“ bleibt immer an letzter Stelle, der Rest wird gemischt
  const idx = (q.options || []).map((_, i) => i);
  const pinned = idx.filter(i => /^(all|none) of the above/i.test(q.options[i]));
  S.order = shuffle(idx.filter(i => !pinned.includes(i))).concat(pinned);

function optRefs(text, q, order) {

    const oi = +n - 1;

}

    h += `<div class="sol-right">Correct: ${idx.map((oi, k) => q.correct[oi] ? (order ? `<b>${LETTERS[k]}</b> ` : '') + esc(q.options[oi]) : null).filter(Boolean).join(' · ') || 'none of the statements'}</div>`;
  }
  if (q.explanation) h += `<p>${optRefs(q.explanation, q, order)}</p>`;
  if (q.note) h += `<p class="sol-note">⚠️ ${optRefs(q.note, q, order)}</p>`;
  if (q.ai) h += `<p class="hint" style="margin:6px 0 0">🤖 Diese Frage hat Claude (KI) nach dem offiziellen Lehrplan erstellt – sie stammt nicht aus deinen Unterlagen.</p>`;
  else if (q.source && q.source.kahoot) h += `<p class="hint" style="margin:6px 0 0">Quelle: Kahoot-Fragensammlung (Test 1 &amp; 2) – Lösung geprüft, Erklärung von Claude</p>`;
  else if (q.source && q.source.page) h += `<p class="hint" style="margin:6px 0 0">Quelle: ${esc(DECK.title)} – PDF-Seite ${q.source.page}</p>`;
  return h + `</div>`;
}
function rate(right) {

  S.lastRight = evaluate(right);
  if (!S.endless && S.i >= S.ids.length - 1) return finish();
  S.i++; S.roundPos++; showQ(); scrollTo(0, 0);
}

function evaluate(forced) {
  const q = BYID[S.ids[S.i]];
  const right = forced ?? q.correct.every((c, oi) => c === S.sel.has(oi));
  const pts = q.options && q.type !== 'card' ? q.correct.filter((c, oi) => c === S.sel.has(oi)).length : (right ? 1 : 0);
  S.lastPts = pts;
  if (!S.counted[q.id]) { S.counted[q.id] = 1; S.done++; if (right) S.right++; S.points += pts; }   // pro Sitzung zählt nur der erste Versuch
  S.answers.push({ id: q.id, sel: [...S.sel], order: S.order, right });
  const before = chapPass(q.chapter);
  record(q.id, right);
  if (chapPass(q.chapter) > before) {   // Durchgang dieses Kapitels gerade fertig geworden
    const x = passSummary(q.chapter, before);
    const msg = `🏁 <b>Kapitel ${q.chapter}: Durchgang ${before} abgeschlossen!</b><br>Erste Antworten: <b style="color:var(--ok)">${x.r} richtig</b> · <b style="color:var(--bad)">${x.w} falsch</b> · <b>${x.pct}% richtig</b><br><span class="hint">Ab jetzt läuft Durchgang ${before + 1} – es zählt wieder nur deine erste Antwort.</span>`;

}
function next() {

      `${S.timeUp ? ' · ⏰ Zeit abgelaufen' : ''}${S.done < S.ids.length ? ` · ${S.ids.length - S.done} Fragen nicht beantwortet (0 Punkte)` : ''}` +

  }

}
function passTable() {
  const rows = DB.chapters.map(ch => ({ ch, cp: chapPass(ch.id) })).filter(x => x.cp > 1);
  if (!rows.length) return `<p class="hint">Sobald du in einem Kapitel jede Frage einmal beantwortet hast, erscheint hier das Ergebnis des Durchgangs.</p>`;
  return `<h2>Abgeschlossene Durchgänge</h2><div class="card">` + rows.map(({ ch, cp }) => {
    const x = passSummary(ch.id, cp - 1);
    return `<div class="row" style="display:flex;justify-content:space-between;gap:12px"><span>${ch.id}. ${esc(ch.title)}<br><span class="hint">Durchgang ${cp - 1} · ${x.w} falsch</span></span><b>${x.r}/${x.n} · ${x.pct}%</b></div>`;
  }).join('') + `</div>`;
}
function resetAll() {
  if (!confirm(`Wirklich alle gespeicherten Antworten und Fehler im Fach „${DECK.title}“ löschen (auf allen Geräten)? Andere Fächer bleiben erhalten.`)) return;
  const ids = allIds(), idset = new Set(ids);
  pending = pending.filter(a => !idset.has(a.id)); pendingSessions = pendingSessions.filter(x => (x.deck || 'bio-gen-1') !== DECK.id);
  lsSet('lernapp_pending', pending); lsSet('lernapp_pending_sessions', pendingSessions);
  api('/api/reset', { ids, deck: DECK.id }).then(d => { P = d; statsView(false); doSync(); }).catch(() => alert('Mac nicht erreichbar – Löschen nur möglich, wenn die Lernapp am Mac läuft.'));
}

/* ---------- Tastatur ---------- */
document.addEventListener('keydown', e => {
  if (!S || e.metaKey || e.ctrlKey || e.altKey || !S.ids.length) return;
  const q = BYID[S.ids[S.i]]; if (!q) return;
  const k = e.key.toLowerCase();
  if (q.type === 'card') {
    if (!S.revealed) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); next(); } return; }
    if (k === '1' || e.key === 'ArrowLeft') { e.preventDefault(); rate(false); }
    else if (k === '2' || e.key === 'ArrowRight') { e.preventDefault(); rate(true); }
    return;
  }
  if (!$('.mdl-tf')) return;
  const n = q.options.length;
  let idx = '123456'.slice(0, n).indexOf(k); if (idx < 0) idx = 'abcdef'.slice(0, n).indexOf(k);
  if (idx >= 0 && k.length === 1) { e.preventDefault(); if (!S.checked) setTF(S.order[idx], S.tf[S.order[idx]] === true ? false : true); }
  else if (k === 's' && S.checked && hasSolution(q)) { e.preventDefault(); S.showSol = !S.showSol; render(); }
  else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); next(); }
});

/* ---------- Fächer (Decks) ---------- */
async function loadDeck(id) {
  const d = DECKS.find(x => x.id === id) || DECKS[0];
  const data = await getJSON(d.file);
  // Fragen-IDs bekommen das Präfix des Fachs, damit sich der Fortschritt der Fächer nie vermischt
  data.questions.forEach(q => { q.id = d.prefix + q.id; });
  DECK = d; DB = data; CH = {}; BYID = {};
  DB.chapters.forEach(c => CH[c.id] = c.title);
  DB.questions.forEach(q => BYID[q.id] = q);
  statFilter = 0;
  try { localStorage.setItem('lernapp_deck', d.id); } catch (_) {}
  document.title = d.title + ' – Lernapp';
}
async function switchDeck(id) { await loadDeck(id); menu(); }

/* ---------- Start ---------- */
(async () => {
  if (WEB) { await window.LERNAPP_READY; SYNC = window.LERNAPP_SYNC || null; }
  try {
    try { DECKS = await getJSON('decks.json'); }
    catch (_) { DECKS = [{ id: 'bio-gen-1', title: 'Medical Biology & Genetics 1', subtitle: '', file: 'questions.json', prefix: '' }]; }
    let want; try { want = localStorage.getItem('lernapp_deck'); } catch (_) {}
    await loadDeck(want);
  } catch (e) { $('#app').innerHTML = '<div class="card">Fragen konnten nicht geladen werden. Bitte über <b>„Lernapp starten.command“</b> öffnen.</div>'; return; }
  try { const info = await api('/api/info'); PHONE_URLS = info.urls || []; SYNC_ON = !!info.sync; } catch (_) {}
  await menu();
  doSync(); // beim Öffnen gleich den neuesten Stand holen
})();
// Zurück zur App (z. B. Handy entsperrt): offene Antworten nachschicken + abgleichen; beim Verlassen ebenfalls abgleichen
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) { flush(); if (Date.now() - syncState.last > 60000) doSync(); }
  else doSync();
});
</script>
